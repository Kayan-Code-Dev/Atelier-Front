<!doctype html>
<html lang="ar" dir="rtl" class="fonts-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier</title>
    <meta name="description" content="Atelier — نظام إدارة الأتيليهات للعمليات، المخزون، العملاء، والفواتير في منصة واحدة احترافية." />
    <meta name="keywords" content="Atelier, نظام إدارة أتيليهات, إدارة التفصيل, المخزون, فواتير" />
    <link rel="canonical" href="https://atelier.app" />
    <!-- Open Graph -->
    <meta property="og:title" content="Atelier — نظام إدارة الأتيليهات" />
    <meta property="og:description" content="إدارة متكاملة للموردين، العملاء، المخزون، الفواتير، والتقارير" />
    <meta property="og:type" content="website" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atelier — نظام إدارة الأتيليهات" />
    <meta name="twitter:description" content="إدارة متكاملة للموردين، العملاء، المخزون، الفواتير، والتقارير" />
    <!-- Google Fonts: Fraunces (brand) + Amiri (display AR) + IBM Plex Sans Arabic (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/fonts/remixicon.css" />
    <style>
      html.fonts-loading body { visibility: hidden !important; }
      body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fade-in 0.6s ease-out; }
    </style>
    <script>
      (function(){
        var d = document.documentElement;
        Promise.all([
          document.fonts.load('400 1em "IBM Plex Sans Arabic"'),
          document.fonts.load('700 1em "IBM Plex Sans Arabic"'),
          document.fonts.load('700 1em Amiri'),
          document.fonts.load('700 1em Fraunces'),
          document.fonts.load('1em remixicon')
        ]).then(function(){ d.classList.remove('fonts-loading'); });
        setTimeout(function(){ d.classList.remove('fonts-loading'); }, 2800);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
