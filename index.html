<!doctype html>
<html lang="ar" dir="rtl" class="fonts-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier</title>
    <meta name="description" content="نظام DressnMore لإدارة الأتيليهات - إدارة متكاملة للموردين، العملاء، المخزون، الفواتير، والتقارير في منصة واحدة سهلة الاستخدام. جرب مجاناً لمدة 30 يوم" />
    <meta name="keywords" content="نظام إدارة أتيليهات, إدارة التفصيل, نظام الخياطة, إدارة المخزون, فواتير الأتيليه, DressnMore" />
    <link rel="canonical" href="https://dressnmore.com" />
    <meta name="last-modified" content="2025-01-01" />
    <!-- Open Graph -->
    <meta property="og:title" content="DressnMore - نظام إدارة شامل لأتيليهات التفصيل" />
    <meta property="og:description" content="إدارة متكاملة للموردين، العملاء، المخزون، الفواتير، والتقارير في منصة واحدة" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dressnmore.com" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DressnMore - نظام إدارة الأتيليهات" />
    <meta name="twitter:description" content="إدارة متكاملة للموردين، العملاء، المخزون، الفواتير، والتقارير" />
    <!-- Self-hosted fonts (render-blocking in head = early discovery) -->
    <link rel="stylesheet" href="/fonts/cairo.css" />
    <link rel="stylesheet" href="/fonts/remixicon.css" />
    <style>
      html.fonts-loading body { visibility: hidden !important; }
      body { font-family: 'Cairo', sans-serif; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fade-in 0.8s ease-out; }
    </style>
    <script>
      (function(){
        var d = document.documentElement;
        Promise.all([
          document.fonts.load('400 1em Cairo'),
          document.fonts.load('700 1em Cairo'),
          document.fonts.load('1em remixicon')
        ]).then(function(){ d.classList.remove('fonts-loading'); });
        setTimeout(function(){ d.classList.remove('fonts-loading'); }, 2500);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
